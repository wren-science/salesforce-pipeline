name: PR checks

# Runs on every pull request with no secrets. When it passes, two trusted workflows run from
# integration's copy of themselves: pr-tests.yml (scratch org, personas, Apex, Playwright, evidence)
# and validate-qa.yml (check-only deploy to QA).
on:
  pull_request:
    branches: [integration]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Metadata, NPSP and .github guards (QG-07, DM-03, PIPE-04, PIPE-08)
        run: node scripts/check-metadata.mjs "origin/${{ github.base_ref }}" "${{ github.head_ref }}"

      - name: No secrets in source (QG-08)
        run: |
          if grep -rnIE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----|force://[^ ]+@|sk-ant-[a-z]{2,4}[0-9]{2}-[A-Za-z0-9_-]{20,}|frontdoor\.jsp\?sid=' --exclude-dir=.git --exclude-dir=node_modules .; then
            echo "::error::Possible credential in source (QG-08)"
            exit 1
          fi
          echo "No credentials found"

      - uses: ./.github/actions/setup-sf
        with:
          code-analyzer: "true"

      - name: Code Analyzer v5, severity 1-2 blocks (QG-03)
        run: |
          if [ -z "$(find force-app -type f ! -name .gitkeep -print -quit)" ]; then
            echo "force-app is empty; nothing to analyse"; exit 0
          fi
          sf code-analyzer run --workspace force-app --severity-threshold 2 --output-file code-analyzer.html

      - name: Upload Code Analyzer report
        if: always() && hashFiles('code-analyzer.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer
          path: code-analyzer.html
