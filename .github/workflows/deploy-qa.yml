name: Deploy to QA

# Every merge to integration deploys to the QA sandbox (our dev org) with sfdx-hardis, then makes QA
# persona-ready and runs the Playwright regression suite as personas (TST-16, PIPE-11). QA is a shared
# org: lean evidence only (screenshots; video and trace on failure), sessions logged out (PIPE-14).
# This workflow runs merged, reviewed code only, so it may hold the QA login.
on:
  push:
    branches: [integration]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-qa
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to QA and run persona regression
    runs-on: ubuntu-latest
    environment: qa
    env:
      CI: "true"
      ORG_ALIAS: integration
      CONFIG_BRANCH: integration
      CI_COMMIT_REF_NAME: integration
      TARGET_USERNAME: ${{ vars.TARGET_USERNAME }}
      INSTANCE_URL: ${{ vars.INSTANCE_URL }}
      SFDX_DISABLE_FLOW_DIFF: "true"
      FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-sf

      - name: Generate the manifest from force-app (PIPE-05)
        run: sf project generate manifest --source-dir force-app --name package --output-dir manifest

      - name: Deploy with sfdx-hardis
        env:
          SFDX_CLIENT_ID_INTEGRATION: ${{ secrets.SFDX_CLIENT_ID_INTEGRATION }}
          SFDX_CLIENT_CERT_INTEGRATION: ${{ secrets.SFDX_CLIENT_CERT_INTEGRATION }}
        run: |
          TEST_LEVEL=$(bash .github/scripts/test-level.sh)
          echo "Test level: $TEST_LEVEL"
          sf hardis auth login
          sf hardis project deploy smart --testlevel "$TEST_LEVEL"

      - name: Make QA persona-ready (JWT login as each persona)
        env:
          SFDX_CLIENT_ID: ${{ secrets.SFDX_CLIENT_ID_INTEGRATION }}
          SFDX_CLIENT_CERT: ${{ secrets.SFDX_CLIENT_CERT_INTEGRATION }}
        run: |
          umask 077
          printf '%s\n' "$SFDX_CLIENT_CERT" > "$RUNNER_TEMP/jwt.key"
          sf org login jwt --client-id "$SFDX_CLIENT_ID" --jwt-key-file "$RUNNER_TEMP/jwt.key" --username "$TARGET_USERNAME" --instance-url "$INSTANCE_URL" --alias qa-admin >/dev/null
          JWT_KEY_FILE="$RUNNER_TEMP/jwt.key" node scripts/personas.mjs --org qa-admin --mode jwt
          rm -f "$RUNNER_TEMP/jwt.key"

      - name: Playwright regression in QA, as personas
        id: playwright
        continue-on-error: true
        working-directory: tests/e2e
        env:
          EVIDENCE: lean
        run: |
          npm ci --no-fund --no-audit
          npx playwright install --with-deps chromium
          export SF_BASE_URL=$(node ../../scripts/lightning-url.mjs qa-admin)
          npx playwright test

      - name: Log out of QA
        if: always()
        run: |
          for a in $(sf alias list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const r of JSON.parse(s.slice(s.indexOf("{"))).result)console.log(r.alias)})'); do
            sf org logout --target-org "$a" --no-prompt >/dev/null 2>&1 || true
          done

      - name: Evidence summary
        if: always()
        run: |
          node scripts/evidence.mjs --playwright tests/e2e/results/results.json \
            --title "QA regression after deploy (${GITHUB_SHA::7})" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-qa
          path: |
            hardis-report
            tests/e2e/results
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore

      - name: Fail if the regression failed
        if: steps.playwright.outcome != 'success'
        run: |
          echo "::error::Persona regression failed in QA. A bug must be raised before the next promotion."
          exit 1
