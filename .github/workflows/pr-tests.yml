name: PR tests
# The run name carries the PR branch and commit: workflows chained after this one (agent review, agent repair)
# run on integration, so their own head_branch/head_sha are integration's, never the PR's.
run-name: "PR tests · ${{ github.event.workflow_run.head_branch }} · ${{ github.event.workflow_run.head_sha }}"

# Every PR is deployed to its story's pool sandbox (ADR 0003): a source-tracked Developer sandbox that
# starts from integration, with the org's packages and configuration. The persona users run the Apex and
# Playwright tests (TST-16), and the evidence is posted back to the PR as the status "tests/personas".
#
# Why three jobs on three runners (PIPE-09):
# - "lease" holds the sandbox's JWT key and runs no PR code. It leases and prepares the sandbox, then hands
#   over short-lived access tokens only.
# - "work" runs the PR's code and tests with those tokens, and revokes them when it finishes.
# - "report" runs trusted code only. It is the one job that can write statuses and comments.
on:
  workflow_run:
    workflows: [PR checks]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

env:
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
  HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}

jobs:
  lease:
    name: Lease and prepare the story's sandbox
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: sandbox-pool
    concurrency:
      group: sandbox-lease
      cancel-in-progress: false
    permissions:
      contents: read
      statuses: write
      issues: write
      pull-requests: write
    outputs:
      sandbox: ${{ steps.lease.outputs.name }}
    steps:
      - name: Mark tests/personas pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$HEAD_SHA" -f state=pending -f context=tests/personas \
            -f description="Preparing the story's sandbox" -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null

      - name: Check out integration (trusted)
        uses: actions/checkout@v4
        with:
          ref: integration

      - uses: ./.github/actions/setup-sf

      - name: Lease (the story's issue holds it; other PRs hold their own)
        id: lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOLDER=$(printf '%s' "$HEAD_BRANCH" | sed -nE 's#^feature/([0-9]+)-.*#\1#p')
          [ -n "$HOLDER" ] || HOLDER=$(gh api "repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:$HEAD_BRANCH" --jq '.[0].number // empty')
          [ -n "$HOLDER" ] || { echo "No open PR for $HEAD_BRANCH"; exit 1; }
          node scripts/sandbox-lease.mjs acquire --holder "$HOLDER"

      - name: No free sandbox
        if: steps.lease.outputs.name == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$HEAD_SHA" -f state=pending -f context=tests/personas \
            -f description="Waiting for a free sandbox; the merge gate retries" >/dev/null
          exit 1

      - uses: ./.github/actions/prepare-sandbox
        with:
          sandbox: ${{ steps.lease.outputs.name }}
          sync: ${{ steps.lease.outputs.new }}
          username: ${{ vars[format('SANDBOX_USERNAME_{0}', steps.lease.outputs.upper)] }}
          instance-url: ${{ vars[format('SANDBOX_URL_{0}', steps.lease.outputs.upper)] }}
          client-id: ${{ secrets[format('SANDBOX_CLIENT_ID_{0}', steps.lease.outputs.upper)] }}
          jwt-key: ${{ secrets[format('SANDBOX_JWT_KEY_{0}', steps.lease.outputs.upper)] }}
          handoff-key: ${{ secrets.SCRATCH_HANDOFF_KEY }}
          artifact: sandbox-handoff

  work:
    name: Deploy and test as personas
    needs: lease
    runs-on: ubuntu-latest
    concurrency:
      group: sandbox-${{ needs.lease.outputs.sandbox }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      apex: ${{ steps.apex.outcome }}
      playwright: ${{ steps.playwright.outcome }}
      deploy: ${{ steps.deploy.outcome }}
    steps:
      - name: Check out integration (trusted scripts and config)
        uses: actions/checkout@v4
        with:
          ref: integration
          fetch-depth: 0

      - name: Take the PR's source and tests
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          rm -rf force-app tests/e2e/specs tests/e2e/support
          git checkout "$HEAD_SHA" -- force-app tests/e2e/specs tests/e2e/support config/personas.json
          # The PR may add test helpers; the harness that signs personas in and captures evidence stays integration's.
          git checkout origin/integration -- tests/e2e/support/global-setup.ts tests/e2e/support/totp.ts tests/e2e/support/evidence.ts
          git status --short | head -50

      - uses: ./.github/actions/setup-sf

      - uses: actions/download-artifact@v4
        with:
          name: sandbox-handoff

      - name: Log in to the sandbox (admin and personas, short-lived)
        env:
          HANDOFF_KEY: ${{ secrets.SCRATCH_HANDOFF_KEY }}
        run: |
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:HANDOFF_KEY -in handover.enc -out handover.json
          node scripts/sandbox-handover.mjs unpack handover.json
          rm -f handover.json handover.enc

      - name: Deploy the PR to the sandbox
        id: deploy
        run: sf project deploy start --source-dir force-app --target-org agent --test-level NoTestRun --wait 30

      - name: Apex tests (this repo's test classes, as personas)
        id: apex
        continue-on-error: true
        run: |
          # The sandbox also holds the org's other code; run only the tests this repo owns.
          ARGS=()
          for f in $(grep -rli --include='*.cls' '@istest' force-app); do ARGS+=(--class-names "$(basename "$f" .cls)"); done
          mkdir -p results/apex
          [ ${#ARGS[@]} -gt 0 ] || { echo "No Apex tests in force-app"; exit 0; }
          sf apex run test --target-org agent "${ARGS[@]}" --code-coverage --result-format junit --output-dir results/apex --wait 30

      - name: Playwright acceptance tests, as personas, full evidence
        id: playwright
        continue-on-error: true
        working-directory: tests/e2e
        env:
          EVIDENCE: full
        run: |
          npm ci --no-fund --no-audit
          npx playwright install --with-deps chromium
          export SF_BASE_URL=$(node ../../scripts/lightning-url.mjs agent)
          npx playwright test

      - name: Revoke the handed-over sessions
        if: always()
        run: node scripts/sandbox-handover.mjs revoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-sandbox
          path: |
            results/apex
            tests/e2e/results
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore

  report:
    name: Post evidence
    needs: [lease, work]
    if: always() && needs.lease.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out integration (trusted)
        uses: actions/checkout@v4
        with:
          ref: integration

      - uses: actions/download-artifact@v4
        with:
          name: evidence-sandbox
          path: evidence
        continue-on-error: true

      - name: Evidence comment and tests/personas status
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SANDBOX: ${{ needs.lease.outputs.sandbox }}
        run: |
          set +e
          node scripts/evidence.mjs --playwright evidence/tests/e2e/results/results.json --apex evidence/results/apex \
            --title "Evidence: sandbox ${SANDBOX:-not leased} (tests/personas)" --run-url "$RUN_URL" > evidence.md
          OK=$?
          [ "${{ needs.work.outputs.deploy }}" = "success" ] || OK=1
          [ "${{ needs.work.outputs.apex }}" = "success" ] || OK=1
          [ "${{ needs.work.outputs.playwright }}" = "success" ] || OK=1
          cat evidence.md >> "$GITHUB_STEP_SUMMARY"
          # Find the PR by its head branch: commits/{sha}/pulls can answer 200 with an empty body.
          PR=$(gh api "repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:$HEAD_BRANCH" --jq '.[0].number // empty')
          if [ -n "$PR" ] && [ -n "$SANDBOX" ]; then
            { echo "<!-- evidence:tests/personas -->"; cat evidence.md; } > evidence-body.md
            CID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --jq '[.[] | select(.body | startswith("<!-- evidence:tests/personas -->"))][0].id')
            if [ -n "$CID" ] && [ "$CID" != "null" ]; then
              gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$CID" -F body=@evidence-body.md >/dev/null
            else
              gh api "repos/${{ github.repository }}/issues/$PR/comments" -F body=@evidence-body.md >/dev/null
            fi
          fi
          if [ -z "$SANDBOX" ]; then
            S=pending; D="Waiting for a free sandbox; the merge gate retries"
          elif [ $OK -eq 0 ]; then S=success; D="All tests passed as personas in $SANDBOX"
          else S=failure; D="Deploy or tests failed in $SANDBOX"; fi
          gh api "repos/${{ github.repository }}/statuses/$HEAD_SHA" -f state=$S -f context=tests/personas -f description="$D" -f target_url="$RUN_URL" >/dev/null
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name=="sandbox-handoff") | .id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null
          done
          [ -z "$SANDBOX" ] && exit 0
          exit $OK
